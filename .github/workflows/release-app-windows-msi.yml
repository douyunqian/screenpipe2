name: Build & Release Windows MSI Installer

# 触发方式：手动触发 + 标签触发（可选）
on:
  workflow_dispatch:  # 手动触发（推荐）
  push:
    tags:
      - 'v*'  # 打标签时自动触发（如 v1.0.0）

env:
  # 全局环境变量，复用原项目配置
  RUST_BACKTRACE: 1
  VCPKG_ROOT: C:\vcpkg
  TAURI_PLATFORM: windows
  # Tauri 构建环境变量
  TAURI_BUNDLE_TARGET: msi  # 强制指定打包格式为 MSI
  CARGO_PROFILE_RELEASE_STRIP: "symbols"  # 精简发布包体积

jobs:
  build-windows-msi:
    runs-on: windows-latest
    permissions:
      contents: write  # 用于上传产物/发布
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整提交记录（用于版本号）

      # 1. 安装系统依赖（MSI打包+Screenpipe核心依赖）
      - name: Install Windows build dependencies
        run: |
          # 安装基础构建依赖
          choco install -y vcredist2022 7zip llvm --no-progress
          # 安装 vcpkg 并配置 onnxruntime（音频/AI 依赖）
          vcpkg install onnxruntime:x64-windows --triplet x64-windows
          vcpkg integrate install
          # 安装 WiX Toolset（MSI 打包必需依赖）
          choco install -y wixtoolset --no-progress
          # 将 WiX 添加到 PATH（适配不同 WiX 版本）
          $wixPath = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset v*" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\bin"
          if ($wixPath) {
              echo $wixPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
        shell: pwsh
        continue-on-error: false  # 依赖安装失败则终止

      # 2. 安装 Bun（前端构建工具）
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          cache: true  # 缓存 Bun 依赖加速安装

      # 3. 安装 Rust 环境（Tauri 核心依赖）
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        id: rust-version
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # 4. 缓存 Rust/Cargo 依赖（加速构建）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./screenpipe-app-tauri/src-tauri -> target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      # 5. 安装前端依赖（Screenpipe 前端）
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ./screenpipe-app-tauri
        env:
          NODE_ENV: production
        timeout-minutes: 10  # 超时保护

      # 6. 前端代码预构建（避免 Tauri 构建时前端打包失败）
      - name: Build frontend assets
        run: bun run build
        working-directory: ./screenpipe-app-tauri
        env:
          VITE_APP_VERSION: ${{ github.ref_name || 'dev' }}
          VITE_APP_GITHASH: ${{ github.sha }}
        timeout-minutes: 10

      # 7. 构建 Tauri 应用并打包为 MSI（核心修复）
      - name: Build Tauri Windows MSI
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 代码签名环境变量（可选，需配置 Secrets）
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: ./screenpipe-app-tauri
          tauriScript: bunx tauri
          # 正确的 MSI 打包参数（修复 --format 错误）
          args: build --release --target x86_64-pc-windows-msvc --bundle-target msi
          # 发布配置（适配 tauri-action 合法参数）
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          # 代码签名（可选）
          windowsCertificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          windowsCertificatePassword: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # 重试机制（处理网络/构建偶发失败）
          retryAttempts: 3
          retryDelay: 5000

      # 8. 验证 MSI 产物是否生成（关键校验）
      - name: Verify MSI Build Output
        run: |
          $msiDir = "./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi"
          $msiFiles = Get-ChildItem -Path $msiDir -Filter "*.msi" -ErrorAction SilentlyContinue
          
          if (-not $msiFiles -or $msiFiles.Count -eq 0) {
              Write-Error "❌ No MSI package found in directory: $msiDir"
              # 输出目录结构便于调试
              Write-Host "📂 Directory contents of target:"
              Get-ChildItem -Recurse ./screenpipe-app-tauri/src-tauri/target | Format-Table Name, FullName, Length
              exit 1
          }
          
          Write-Host "✅ Found MSI package(s):"
          $msiFiles | Select-Object Name, Length, LastWriteTime | Format-Table
        shell: pwsh

      # 9. 上传 MSI 产物（方便下载）
      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenpipe-windows-msi-${{ github.ref_name || 'latest' }}
          path: |
            ./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            ./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/screenpipe.exe
          retention-days: 90  # 产物保留 90 天
          if-no-files-found: error  # 无文件则触发错误

      # 10. 自动创建 GitHub Release（仅打标签时触发）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            ./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/screenpipe.exe
          name: Screenpipe ${{ github.ref_name }} - Windows MSI
          body: |
            ## 📦 Windows MSI Installer Release
            - Build Environment: Windows Latest (${{ runner.os }})
            - Commit Hash: ${{ github.sha }}
            - Rust Version: ${{ steps.rust-version.outputs.rustc-version }}
            - Tauri Version: ${{ steps.tauri-build.outputs.tauri-version }}
            
            ### 🚀 Installation Steps
            1. Download the MSI installer from the Assets section
            2. Run the installer (admin privileges required)
            3. Follow the setup wizard to complete installation
            
            ### ⚠️ Notes
            - Requires Windows 10/11 (64-bit)
            - VC++ 2022 Runtime is required (included in the installer)
            - Antivirus may flag first run (disable temporarily if needed)
            
            ### 📝 Changelog
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true  # 自动生成更新日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. 清理构建缓存（彻底修复所有报错：移除易出问题的命令，仅保留安全的文件删除）
      - name: Cleanup Build Cache
        if: always()  # 无论前面步骤是否成功，都执行清理
        run: |
          # ========== 1. Rust 缓存清理（仅删除项目内缓存，不碰全局） ==========
          # 删除项目内的 target 目录（构建产物，体积最大，且不影响全局环境）
          $targetDir = "./screenpipe-app-tauri/src-tauri/target"
          if (Test-Path $targetDir) {
              Write-Host "🧹 Deleting project target directory: $targetDir"
              Remove-Item -Recurse -Force $targetDir -ErrorAction SilentlyContinue
          } else {
              Write-Host "ℹ️ Target directory not found: $targetDir"
          }

          # ========== 2. Bun 缓存清理（替换为文件删除，避免命令报错） ==========
          # 直接删除 Bun 缓存目录（替代 bun cache clean 命令）
          $bunCacheDir = "$env:USERPROFILE\.bun\cache"
          if (Test-Path $bunCacheDir) {
              Write-Host "🧹 Deleting Bun cache directory: $bunCacheDir"
              Remove-Item -Recurse -Force $bunCacheDir -ErrorAction SilentlyContinue
          } else {
              Write-Host "ℹ️ Bun cache directory not found: $bunCacheDir"
          }

          # ========== 3. VCPKG 缓存清理（可选，仅删除临时构建文件） ==========
          $vcpkgBuildDir = "$env:VCPKG_ROOT\buildtrees"
          if (Test-Path $vcpkgBuildDir) {
              Write-Host "🧹 Deleting vcpkg build cache: $vcpkgBuildDir"
              Remove-Item -Recurse -Force $vcpkgBuildDir -ErrorAction SilentlyContinue
          } else {
              Write-Host "ℹ️ VCPKG build directory not found: $vcpkgBuildDir"
          }

          # ========== 4. 清理前端 node_modules（可选，释放空间） ==========
          $nodeModulesDir = "./screenpipe-app-tauri/node_modules"
          if (Test-Path $nodeModulesDir) {
              Write-Host "🧹 Deleting node_modules directory: $nodeModulesDir"
              Remove-Item -Recurse -Force $nodeModulesDir -ErrorAction SilentlyContinue
          } else {
              Write-Host "ℹ️ node_modules directory not found: $nodeModulesDir"
          }
        shell: pwsh
        continue-on-error: true  # 清理失败不影响整体流程
