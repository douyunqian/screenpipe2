name: Release Windows MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: rust-src, clippy, rustfmt

      - name: Install Tauri dependencies
        run: |
          choco install -y wget 7zip
          rustup target add x86_64-pc-windows-msvc

      - name: Build screenpipe core binary
        run: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: ${{ github.workspace }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install app dependencies
        run: |
          cd screenpipe-app-tauri
          bun install

      # 核心修复：指定正确的 pre_build.js 路径
      - name: Run pre-build script (fix FFmpeg + copy binary)
        run: |
          cd screenpipe-app-tauri
          bun run scripts/pre_build.js # 关键：加上 scripts/ 目录

      - name: Build Tauri MSI
        run: |
          cd screenpipe-app-tauri
          bun run tauri build --target x86_64-pc-windows-msvc -- --features msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenpipe2-windows-msi
          path: screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
