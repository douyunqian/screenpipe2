name: Build & Release Windows MSI Installer

# 触发方式：手动触发 + 标签触发（可选）
on:
  workflow_dispatch:  # 手动触发（推荐）
  push:
    tags:
      - 'v*'  # 打标签时自动触发（如 v1.0.0）

env:
  # 全局环境变量，复用原项目配置
  RUST_BACKTRACE: 1
  VCPKG_ROOT: C:\vcpkg
  TAURI_PLATFORM: windows
  # Tauri 构建环境变量
  TAURI_BUNDLE_TARGET: msi  # 强制指定打包格式为 MSI
  CARGO_PROFILE_RELEASE_STRIP: "symbols"  # 精简发布包体积

jobs:
  build-windows-msi:
    runs-on: windows-latest
    permissions:
      contents: write  # 用于上传产物/发布
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整提交记录（用于版本号）

      # 1. 安装系统依赖（原 release-app.yml 核心依赖）
      - name: Install Windows build dependencies
        run: |
          # 安装 VC++ 运行时、7zip、LLVM（Screenpipe 依赖）
          choco install -y vcredist2022 7zip llvm --no-progress
          # 安装 vcpkg 并配置 onnxruntime（音频/AI 依赖）
          vcpkg install onnxruntime:x64-windows --triplet x64-windows
          vcpkg integrate install
          # 安装 WiX Toolset（MSI 打包必需依赖）
          choco install -y wixtoolset --no-progress
          # 将 WiX 添加到 PATH
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      # 2. 安装 Bun（前端构建工具）
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          cache: true  # 缓存 Bun 依赖

      # 3. 安装 Rust 环境（Tauri 核心依赖）
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # 4. 缓存 Rust/Cargo 依赖（加速构建）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./screenpipe-app-tauri/src-tauri -> target
          cache-onnxruntime: true  # 缓存 onnxruntime 依赖
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

      # 5. 安装前端依赖（Screenpipe 前端）
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ./screenpipe-app-tauri
        env:
          # 跳过可选依赖安装，加速构建
          NODE_ENV: production

      # 6. 前端代码构建（提前构建避免 Tauri 构建时出错）
      - name: Build frontend assets
        run: bun run build
        working-directory: ./screenpipe-app-tauri
        env:
          VITE_APP_VERSION: ${{ github.ref_name || 'dev' }}
          VITE_APP_GITHASH: ${{ github.sha }}

      # 7. 构建 Tauri 应用并打包为 MSI（核心修复）
      - name: Build Tauri Windows MSI
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 代码签名环境变量（可选）
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri 签名环境变量
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          # 核心配置修正
          projectPath: ./screenpipe-app-tauri
          tauriScript: bunx tauri
          # 正确传递 MSI 打包参数（替换错误的 --format）
          args: build --release --target x86_64-pc-windows-msvc --bundle-target msi
          # 移除无效的 release 参数，改用 args 中的 --release
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          # 代码签名配置（可选）
          windowsCertificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          windowsCertificatePassword: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # 构建重试机制
          retryAttempts: 3
          retryDelay: 5000

      # 8. 验证 MSI 产物是否生成
      - name: Verify MSI Build Output
        run: |
          $msiPath = "./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/"
          if (-not (Test-Path "$msiPath/*.msi")) {
              Write-Error "MSI package not found in $msiPath"
              Get-ChildItem -Recurse ./screenpipe-app-tauri/src-tauri/target | Format-Table
              exit 1
          }
          # 输出产物信息
          Get-ChildItem "$msiPath/*.msi" | Select-Object Name, Length, LastWriteTime
        shell: pwsh

      # 9. 上传 MSI 产物（方便下载）
      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenpipe-windows-msi-${{ github.ref_name || 'latest' }}
          path: |
            ./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            ./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/screenpipe.exe
            ./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.wixpdb  # 调试用（可选）
          retention-days: 90  # 延长产物保留时间
          if-no-files-found: error  # 无文件时触发错误

      # 10. 自动创建 GitHub Release 并上传 MSI（仅打标签时触发）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            ./screenpipe-app-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/screenpipe.exe
          name: Screenpipe ${{ github.ref_name }} - Windows MSI
          body: |
            ## Windows MSI Installer Release
            - Built on: ${{ runner.os }} (Windows Latest)
            - Commit: ${{ github.sha }}
            - Rust Version: ${{ steps.rust-version.outputs.rustc-version }}
            - Tauri Version: ${{ steps.tauri-build.outputs.tauri-version }}
            
            ### Installation
            1. Download the MSI installer
            2. Run the installer (admin privileges required)
            3. Follow the setup wizard
            
            ### Notes
            - Requires Windows 10/11 (64-bit)
            - VC++ 2022 Runtime is required (included in installer)
            - Antivirus may flag the first run (digital signature optional)
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true  # 自动生成更新日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. 清理构建缓存（可选，节省空间）
      - name: Cleanup Build Cache
        if: always()
        run: |
          cargo cache clean --git
          bun cache clean
        shell: pwsh
