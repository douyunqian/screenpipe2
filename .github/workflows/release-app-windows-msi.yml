# .github/workflows/release-app-windows-msi.yml
name: Build & Release Windows MSI Installer

# 触发方式：手动触发 + 标签触发（可选）
on:
  workflow_dispatch:  # 手动触发（推荐）
  push:
    tags:
      - 'v*'  # 打标签时自动触发（如 v1.0.0）

env:
  # 全局环境变量，复用原项目配置
  RUST_BACKTRACE: 1
  VCPKG_ROOT: C:\vcpkg
  TAURI_PLATFORM: windows

jobs:
  build-windows-msi:
    runs-on: windows-latest
    permissions:
      contents: write  # 用于上传产物/发布
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整提交记录（用于版本号）

      # 1. 安装系统依赖（原 release-app.yml 核心依赖）
      - name: Install Windows build dependencies
        run: |
          # 安装 VC++ 运行时、7zip、LLVM（Screenpipe 依赖）
          choco install -y vcredist2022 7zip llvm
          # 安装 vcpkg 并配置 onnxruntime（音频/AI 依赖）
          vcpkg install onnxruntime:x64-windows
          vcpkg integrate install

      # 2. 安装 Bun（前端构建工具）
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 3. 安装 Rust 环境（Tauri 核心依赖）
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # 4. 缓存 Rust/Cargo 依赖（加速构建）
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./screenpipe-app-tauri/src-tauri -> target

      # 5. 安装前端依赖（Screenpipe 前端）
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: ./screenpipe-app-tauri

      # 6. 构建 Tauri 应用并打包为 MSI（核心修改点）
      - name: Build Tauri Windows MSI
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：如果需要代码签名，添加签名证书环境变量
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: ./screenpipe-app-tauri  # Tauri 项目根路径
          args: --format msi  # 强制打包为 MSI（替换默认的 NSIS）
          release: true       # 生产环境构建（优化体积/性能）
          # 可选：启用代码签名（需提前配置证书）
          # windowsCertificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          # windowsCertificatePassword: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # 7. 上传 MSI 产物（方便下载）
      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenpipe-windows-msi
          path: |
            ./screenpipe-app-tauri/src-tauri/target/release/bundle/msi/*.msi
            ./screenpipe-app-tauri/src-tauri/target/release/screenpipe.exe  # 可选：附带可执行文件
          retention-days: 30  # 产物保留 30 天

      # 8. 可选：自动创建 GitHub Release 并上传 MSI
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')  # 仅打标签时触发
        uses: softprops/action-gh-release@v2
        with:
          files: ./screenpipe-app-tauri/src-tauri/target/release/bundle/msi/*.msi
          name: Release ${{ github.ref_name }}
          body: "Screenpipe Windows MSI Installer - ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
